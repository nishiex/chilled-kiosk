<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3D Coffee Tumbler</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ef;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* 3D Canvas */
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI */
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #222;
      letter-spacing: -0.5px;
    }

    .status {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      font-size: 13px;
      color: #555;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .bottom-panel {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .controls {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #000;
    }

    .color-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .grey {
      background: #808080;
    }

    .black {
      background: #171717;
    }

    .white {
      background: #f5f5f5;
    }

    .brown {
      background: #8b5e3c;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f3ef;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: #333;
    }

    .loader {
      width: 36px;
      height: 36px;
      border: 3px solid #ddd;
      border-top-color: #222;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .ui {
        padding: 18px;
      }

      .controls {
        width: calc(100% - 20px);
        justify-content: center;
        flex-wrap: wrap;
      }
    }
  </style>

  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <div id="app">

    <!-- Loading screen -->
    <div class="loading" id="loading">
      <div class="loading-content">
        <div class="loader"></div>
        <div>Loading tumbler...</div>
      </div>
    </div>

    <!-- Three.js -->
    <div id="canvas-container"></div>

    <!-- UI -->
    <div class="ui">

      <div class="top-bar">
        <div class="logo">
          CHILLED
        </div>

        <div class="status" id="status">
          3D Model
        </div>
      </div>

      <div class="bottom-panel">

        <div class="controls">

          <button onclick="resetModel()">
            Reset
          </button>

          <button
            class="color-button grey"
            onclick="changeColor('#808080')"
            title="Grey"
          ></button>

          <button
            class="color-button black"
            onclick="changeColor('#171717')"
            title="Black"
          ></button>

          <button
            class="color-button white"
            onclick="changeColor('#f5f5f5')"
            title="White"
          ></button>

          <button
            class="color-button brown"
            onclick="changeColor('#8b5e3c')"
            title="Brown"
          ></button>

        </div>

      </div>

    </div>

  </div>


  <script type="module">

    import * as THREE from "three";

    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";

    import { OrbitControls } from "three/addons/controls/OrbitControls.js";


    // --------------------------------------------------
    // BASIC SETUP
    // --------------------------------------------------

    const container =
      document.getElementById("canvas-container");

    const loading =
      document.getElementById("loading");

    const status =
      document.getElementById("status");


    // Scene
    const scene = new THREE.Scene();

    scene.background = new THREE.Color("#f5f3ef");


    // Camera
    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    camera.position.set(
      0,
      1,
      5
    );


    // Renderer
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    container.appendChild(
      renderer.domElement
    );


    // --------------------------------------------------
    // CONTROLS
    // --------------------------------------------------

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.enablePan = false;

    controls.minDistance = 2;

    controls.maxDistance = 10;

    controls.target.set(
      0,
      0.8,
      0
    );


    // --------------------------------------------------
    // LIGHTING
    // --------------------------------------------------

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        2
      );

    scene.add(
      ambientLight
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        4
      );

    keyLight.position.set(
      4,
      6,
      4
    );

    keyLight.castShadow = true;

    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    fillLight.position.set(
      -4,
      3,
      2
    );

    scene.add(
      fillLight
    );


    const rimLight =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );

    rimLight.position.set(
      0,
      4,
      -5
    );

    scene.add(
      rimLight
    );


    // --------------------------------------------------
    // FLOOR
    // --------------------------------------------------

    const floorGeometry =
      new THREE.PlaneGeometry(
        20,
        20
      );

    const floorMaterial =
      new THREE.ShadowMaterial({
        opacity: 0.15
      });

    const floor =
      new THREE.Mesh(
        floorGeometry,
        floorMaterial
      );

    floor.rotation.x =
      -Math.PI / 2;

    floor.position.y =
      -1.2;

    floor.receiveShadow = true;

    scene.add(
      floor
    );


    // --------------------------------------------------
    // MODEL
    // --------------------------------------------------

    let tumbler = null;

    let originalPosition = null;

    let originalRotation = null;

    let originalScale = null;


    const loader =
      new OBJLoader();


    loader.load(

      "./model/coffee-cup.obj",

      function (object) {

        console.log(
          "OBJ loaded successfully",
          object
        );


        tumbler = object;


        // ----------------------------------------------
        // FIND MODEL SIZE
        // ----------------------------------------------

        const box =
          new THREE.Box3()
            .setFromObject(object);

        const size =
          box.getSize(
            new THREE.Vector3()
          );

        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        // Move model to center
        object.position.x =
          -center.x;

        object.position.y =
          -center.y;

        object.position.z =
          -center.z;


        // ----------------------------------------------
        // AUTO SCALE
        // ----------------------------------------------

        const maxDimension =
          Math.max(
            size.x,
            size.y,
            size.z
          );


        const targetSize = 3;


        const scale =
          targetSize /
          maxDimension;


        object.scale.setScalar(
          scale
        );


        // ----------------------------------------------
        // MATERIAL
        // ----------------------------------------------

        object.traverse(
          function (child) {

            if (child.isMesh) {

              child.castShadow =
                true;

              child.receiveShadow =
                true;


              child.material =
                new THREE.MeshStandardMaterial({

                  color: 0x808080,

                  roughness: 0.3,

                  metalness: 0.1
                });

            }

          }
        );


        // ----------------------------------------------
        // POSITION
        // ----------------------------------------------

        object.position.y =
          -0.3;


        scene.add(
          object
        );


        // Save initial state
        originalPosition =
          object.position.clone();

        originalRotation =
          object.rotation.clone();

        originalScale =
          object.scale.clone();


        // Hide loading
        loading.classList.add(
          "hidden"
        );


        status.textContent =
          "Ready";


        console.log(
          "Tumbler ready"
        );

      },

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            (
              xhr.loaded /
              xhr.total
            ) * 100;


          status.textContent =
            `${Math.round(percent)}%`;

        }

      },

      function (error) {

        console.error(
          "Error loading OBJ:",
          error
        );


        status.textContent =
          "Model error";


        loading.innerHTML = `
          <div class="loading-content">
            <h3>Unable to load model</h3>
            <p style="margin-top:8px;">
              Check the OBJ file path.
            </p>
          </div>
        `;

      }

    );


    // --------------------------------------------------
    // CHANGE COLOR
    // --------------------------------------------------

    window.changeColor =
      function (color) {

        if (!tumbler) return;


        tumbler.traverse(
          function (child) {

            if (
              child.isMesh &&
              child.material
            ) {

              child.material.color.set(
                color
              );

            }

          }
        );

      };


    // --------------------------------------------------
    // RESET MODEL
    // --------------------------------------------------

    window.resetModel =
      function () {

        if (!tumbler) return;


        tumbler.position.copy(
          originalPosition
        );

        tumbler.rotation.copy(
          originalRotation
        );

        tumbler.scale.copy(
          originalScale
        );


        controls.reset();

      };


    // --------------------------------------------------
    // WINDOW RESIZE
    // --------------------------------------------------

    window.addEventListener(
      "resize",
      function () {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // --------------------------------------------------
    // ANIMATION
    // --------------------------------------------------

    function animate() {

      requestAnimationFrame(
        animate
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    animate();

  </script>

</body>
</html>
