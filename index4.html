<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

  <title>Chilled — Self Ordering Kiosk</title>

  <!-- =====================================================
       THREE.JS IMPORT MAP
  ====================================================== -->

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>

  <!-- =====================================================
       CSS
  ====================================================== -->

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #1844ab;
      --white: #ffffff;
      --soft-white: rgba(255, 255, 255, 0.78);
      --line: rgba(255, 255, 255, 0.2);
      --card: rgba(255, 255, 255, 0.1);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--blue);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    /* =====================================================
       KIOSK
    ====================================================== */

    .kiosk {
      position: relative;

      width: 100vw;
      height: 100vh;
      min-height: 600px;

      overflow: hidden;
      isolation: isolate;

      background: var(--blue);
      color: var(--white);
    }

    /* =====================================================
       BACKGROUND ART
    ====================================================== */

    .art-layer {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;
      pointer-events: none;

      z-index: -1;

      background: var(--blue);
    }

    .art-sprite {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 120%;
      height: 120%;

      max-width: none;

      display: block;

      object-fit: cover;
      object-position: center;

      transform: translate3d(-50%, -50%, 0);
      transform-origin: center center;

      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;

      will-change: transform;
    }

    .art-layer::after {
      content: "";

      position: absolute;
      inset: 0;

      background: linear-gradient(
        90deg,
        rgba(24, 68, 171, 0.94) 0%,
        rgba(24, 68, 171, 0.72) 35%,
        rgba(24, 68, 171, 0.18) 70%,
        rgba(24, 68, 171, 0.55) 100%
      );
    }

    /* =====================================================
       3D TUMBLER
       Positioned above the "Popular Recipes" card (01),
       enlarged.
    ====================================================== */

#tumbler-container {
  position: absolute;

  /* Horizontal position */
  left: 32%;

  /* Vertical position */
  top: 62%;

  /* Size of the 3D viewing area */
  width: 34vw;
  height: 60vh;

  transform: translate(-50%, -50%);

  z-index: 1;

  pointer-events: none;
}

#tumbler-container canvas {
  display: block;

  width: 100% !important;
  height: 100% !important;
}

    /* =====================================================
       MODEL LOADING
    ====================================================== */

    .model-loading {
      position: absolute;

      left: 32%;
      top: 62%;

      transform: translate(-50%, -50%);

      z-index: 2;

      color: rgba(255, 255, 255, 0.7);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.14em;

      pointer-events: none;

      transition: opacity 300ms ease;
    }

    .model-loading.hidden {
      opacity: 0;
    }

    /* =====================================================
       CONTENT
    ====================================================== */

    .content {
      position: relative;

      width: min(1440px, 100%);
      height: 100%;

      margin: 0 auto;

      padding:
        clamp(28px, 4vw, 64px)
        clamp(22px, 4vw, 64px);

      display: flex;
      flex-direction: column;

      z-index: 2;

      pointer-events: none;
    }

    /* =====================================================
       BRAND
    ====================================================== */

    .brand {
      display: flex;

      align-items: baseline;

      gap: 12px;

      letter-spacing: 0.08em;
    }

    .brand-mark {
      font-size: clamp(18px, 1.5vw, 26px);

      font-weight: 800;
    }

    .brand-subtitle {
      font-size: 10px;

      font-weight: 700;

      opacity: 0.7;
    }

    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      max-width: 720px;

      margin-top:
        clamp(55px, 10vh, 130px);
    }

    .eyebrow {
      margin: 0 0 14px;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 0.2em;

      opacity: 0.7;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(48px, 6.5vw, 104px);

      line-height: 0.94;

      letter-spacing: -0.055em;

      font-weight: 800;
    }

    h1 span {
      opacity: 0.68;
    }

    .intro {
      max-width: 500px;

      margin: 26px 0 0;

      color: var(--soft-white);

      font-size:
        clamp(15px, 1.25vw, 19px);

      line-height: 1.5;
    }

    /* =====================================================
       OPTIONS
    ====================================================== */

    .options {
      width: min(760px, 100%);

      margin-top: auto;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      pointer-events: auto;
    }

    .option-card {
      min-height: 116px;

      border: 1px solid var(--line);

      border-radius: 20px;

      background: var(--card);

      color: var(--white);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      padding: 20px 22px;

      display: grid;

      grid-template-columns:
        42px
        1fr
        28px;

      align-items: center;

      text-align: left;

      cursor: pointer;

      transition:
        transform 220ms ease,
        background 220ms ease,
        border-color 220ms ease;

      touch-action: manipulation;
    }

    .option-card:hover,
    .option-card:focus-visible {
      transform: translateY(-4px);

      background: rgba(255, 255, 255, 0.16);

      border-color: rgba(255, 255, 255, 0.42);

      outline: none;
    }

    .option-card:active {
      transform: scale(0.985);
    }

    .option-number {
      align-self: start;

      font-size: 11px;

      font-weight: 700;

      opacity: 0.55;
    }

    .option-card strong {
      display: block;

      margin-bottom: 6px;

      font-size:
        clamp(17px, 1.5vw, 23px);
    }

    .option-card small {
      color: rgba(255, 255, 255, 0.65);

      font-size: 12px;
    }

    .arrow {
      justify-self: end;

      font-size: 22px;

      opacity: 0.7;
    }

    /* =====================================================
       FOOTER
    ====================================================== */

    footer {
      display: flex;

      justify-content: space-between;

      gap: 20px;

      padding-top: 22px;

      color: rgba(255, 255, 255, 0.48);

      font-size: 11px;

      letter-spacing: 0.04em;
    }

    /* =====================================================
       TABLET / MOBILE
    ====================================================== */

    @media (max-width: 800px) {

      .kiosk {
        min-height: 100vh;
      }

      .content {
        padding:
          28px 22px 22px;
      }

      .hero {
        margin-top: 48px;
      }

      .options {
        grid-template-columns: 1fr;

        gap: 9px;
      }

      .option-card {
        min-height: 88px;

        border-radius: 16px;
      }

      footer span:last-child {
        display: none;
      }

      .art-sprite {
        width: 145%;
        height: 145%;
      }
    }

    /* =====================================================
       SMALL HEIGHT
    ====================================================== */

    @media (max-height: 760px) and (min-width: 801px) {

      .hero {
        margin-top: 45px;
      }

      h1 {
        font-size:
          clamp(44px, 5vw, 76px);
      }

      .option-card {
        min-height: 92px;
      }
    }


/* =====================================================

@media (max-width: 800px) {

    margin-bottom: 10px;

    margin-top: 18px;

  #tumbler-container {
    left: 50%;

  }


  #tumbler-container canvas {
    width: 100% !important;

  /* ===================================================

  ==================================================== */

  .model-loading {

  }


  /* ===================================================
     OPTIONS
  ==================================================== */

  .options {
    width: 100%;

    margin-top: auto;

    grid-template-columns: 1fr;

    gap: 8px;

    position: relative;

    z-index: 3;
  }


  .option-card {
    min-height: 70px;

    padding: 14px 16px;

    border-radius: 15px;

    grid-template-columns:
      32px

  }


  .option-number {

  }


  .option-card strong {
    margin-bottom: 3px;

  }


  .option-card small {

  }

  }


  /* ===================================================
     FOOTER
  ==================================================== */

  footer {

  }

  footer span:last-child {

  }

  ==================================================== */

  .art-sprite {
    width: 145%;

    height: 145%;
  }
}

  </style>

</head>

<body>

  <!-- =====================================================
       KIOSK
  ====================================================== -->

  <main class="kiosk">

<!-- ===================================================
     BACKGROUND
==================================================== -->

<section
  class="art-layer"
  aria-hidden="true"
>
  <img
    src="kiosk-art.svg"
    class="art-sprite"

  />
</section>


<!-- ===================================================

==================================================== -->

<div

  aria-hidden="true"
></div>


<!-- ===================================================

==================================================== -->

<div
  id="model-loading"
  class="model-loading"
>
  LOADING
</div>


<!-- ===================================================
     CONTENT
==================================================== -->

<section class="content">

  <!-- BRAND -->

  <div class="brand">

    <span class="brand-mark">
      CHILLED
    </span>

    <span class="brand-subtitle">
      SELF ORDERING
    </span>

  </div>


  <!-- HERO -->

  <div class="hero">

    <p class="eyebrow">
      WELCOME
    </p>

    <h1>
      What would you<br />

    </h1>

  </div>


  <!-- OPTIONS -->

  <div

  >

    <button

    >

      <span class="option-number">

  </main>

  <!-- =====================================================
       GSAP
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

  <!-- =====================================================
       THREE.JS
  ====================================================== -->

  <script type="module">

    import * as THREE from "three";

    import {
      OBJLoader
    } from "three/addons/loaders/OBJLoader.js";


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const container =
      document.getElementById(
        "tumbler-container"
      );

    const loading =
      document.getElementById(
        "model-loading"
      );


    /* =====================================================
       SCENE
    ====================================================== */

    const scene =
      new THREE.Scene();


    /* =====================================================
       CAMERA
       
       FIXED CAMERA.
       
       The camera does NOT rotate.
       The camera does NOT move.
    ====================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        35,

        container.clientWidth /
          container.clientHeight,

        0.1,

        100
      );


    camera.position.set(
      0,
      0,
      6
    );


    camera.lookAt(
      0,
      0,
      0
    );


    /* =====================================================
       RENDERER
    ====================================================== */

    const renderer =
      new THREE.WebGLRenderer({

        antialias: true,

        alpha: true

      });


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );


    renderer.outputColorSpace =
      THREE.SRGBColorSpace;


    container.appendChild(
      renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ====================================================== */

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        2
      );


    scene.add(
      ambientLight
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        4
      );


    keyLight.position.set(
      4,
      6,
      5
    );


    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xffffff,
        2
      );


    fillLight.position.set(
      -4,
      2,
      4
    );


    scene.add(
      fillLight
    );


    const rimLight =
      new THREE.DirectionalLight(
        0xffffff,
        2.5
      );


    rimLight.position.set(
      0,
      4,
      -5
    );


    scene.add(
      rimLight
    );


    /* =====================================================
       LOAD OBJ
       
       FILE:
       ./model/coffee cup.obj
    ====================================================== */

    let tumbler = null;


    const loader =
      new OBJLoader();


    loader.load(

      "./model/coffee-cup.obj",


      /* ===================================================
         MODEL LOADED
      ==================================================== */

      function (object) {

        tumbler = object;


        /* -------------------------------------------------
           FIND MODEL BOUNDS
        ------------------------------------------------- */

        const box =
          new THREE.Box3()
            .setFromObject(
              object
            );


        const center =
          box.getCenter(
            new THREE.Vector3()
          );


        const size =
          box.getSize(
            new THREE.Vector3()
          );


        /* -------------------------------------------------
           CENTER MODEL
           
           This makes the rotation happen around
           the center of the model.
        ------------------------------------------------- */

        object.position.sub(
          center
        );


        /* -------------------------------------------------
           SCALE MODEL
        ------------------------------------------------- */

        const maxDimension =
          Math.max(
            size.x,
            size.y,
            size.z
          );


        const targetSize = 2.0;


        const scale =
          targetSize /
          maxDimension;


        object.scale.setScalar(
          scale
        );


        /* -------------------------------------------------
           MATERIAL
        ------------------------------------------------- */

        object.traverse(
          function (child) {

            if (
              child.isMesh
            ) {

              child.castShadow =
                true;

              child.receiveShadow =
                true;


              child.material =
                new THREE.MeshStandardMaterial({

                  color: 0x808080,

                  roughness: 0.3,

                  metalness: 0.05

                });

            }

          }
        );


        /* -------------------------------------------------
           FINAL POSITION
           
           Exact center of the Three.js scene.
        ------------------------------------------------- */

        object.position.set(
          0,
          0,
          0
        );


        /* -------------------------------------------------
           ADD TO SCENE
        ------------------------------------------------- */

        scene.add(
          object
        );


        /* -------------------------------------------------
           HIDE LOADING
        ------------------------------------------------- */

        loading.classList.add(
          "hidden"
        );

      },


      /* ===================================================
         LOADING PROGRESS
      ==================================================== */

      function (xhr) {

        if (
          xhr.total
        ) {

          const percent =
            Math.round(
              (
                xhr.loaded /
                xhr.total
              ) * 100
            );


          loading.textContent =
            `LOADING ${percent}%`;

        }

      },


      /* ===================================================
         ERROR
      ==================================================== */

      function (error) {

        console.error(
          "OBJ loading error:",
          error
        );


        loading.textContent =
          "MODEL ERROR";

      }

    );


    /* =====================================================
       RESIZE
    ====================================================== */

    function resizeThree() {

      const width =
        container.clientWidth;


      const height =
        container.clientHeight;


      camera.aspect =
        width / height;


      camera.updateProjectionMatrix();


      renderer.setSize(
        width,
        height
      );

    }


    window.addEventListener(
      "resize",
      resizeThree
    );


    /* =====================================================
       ANIMATION
       
       ONLY THE TUMBLER ROTATES.
       
       CAMERA REMAINS COMPLETELY FIXED.
    ====================================================== */

    function animate() {

      requestAnimationFrame(
        animate
      );


      if (tumbler) {

        tumbler.rotation.y += 0.006;

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();

  </script>

  <!-- =====================================================
       UI ANIMATIONS
  ====================================================== -->

  <script>

    const artwork =
      document.querySelector(
        ".art-sprite"
      );


    let artworkTween = null;

    let resizeTimer = null;


    function createArtworkLoop() {

      if (!artwork) {
        return;
      }


      if (artworkTween) {

        artworkTween.kill();

      }


      gsap.set(
        artwork,
        {
          xPercent: -50,

          yPercent: -50,

          scale: 1.10,

          force3D: true,

          transformOrigin:
            "center center"
        }
      );


      artworkTween =
        gsap.to(
          artwork,
          {

            xPercent: -54,

            yPercent: -54,

            scale: 1.13,

            duration: 1,

            ease: "sine.inOut",

            repeat: -1,

            yoyo: true

          }
        );

    }


    function animateInterface() {

      gsap.from(
        ".brand",
        {

          y: -20,

          opacity: 0,

          duration: 0.7,

          ease: "power2.out"

        }
      );


      gsap.from(
        ".hero > *",
        {

          y: 28,

          opacity: 0,

          duration: 0.8,

          stagger: 0.08,

          delay: 0.15,

          ease: "power3.out"

        }
      );


      gsap.from(
        ".option-card",
        {

          y: 30,

          opacity: 0,

          duration: 0.7,

          stagger: 0.09,

          delay: 0.35,

          ease: "power3.out"

        }
      );

    }


    window.addEventListener(
      "load",
      function () {

        createArtworkLoop();

        animateInterface();

      }
    );


    window.addEventListener(
      "resize",
      function () {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            function () {

              createArtworkLoop();

            },
            180
          );

      }
    );

  </script>

</body>
